name: Pull request verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: ${{ matrix.app }} verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [admin-portal, resident-pwa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regression tests
        run: npm test --workspace=apps/${{ matrix.app }}
      - name: Type check
        run: npm run type-check --workspace=apps/${{ matrix.app }}
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build --workspace=apps/${{ matrix.app }}

  ai-python-syntax:
    name: AI and API Python syntax verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile AI and API Python source without importing dependencies
        run: python -m compileall -q services/ai apps/api

  voice-auth-runtime:
    name: API voice authorization runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install 'fastapi>=0.110,<1' 'httpx>=0.27,<0.28' 'pytest>=8,<10' 'pytest-asyncio>=0.23,<2' 'python-dotenv>=1,<2'
      - name: Verify unauthenticated voice calls are blocked
        env:
          PYTHONPATH: apps/api
        run: python -m pytest -q apps/api/tests/test_voice_auth.py

  pwa-offline-browser:
    name: Resident PWA Chromium offline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Install browser test runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production PWA
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build:pwa
      - name: Launch PWA and verify offline behavior
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm run start --workspace=apps/resident-pwa -- --hostname 127.0.0.1 --port 5173 > /tmp/resident-pwa.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/~offline >/dev/null; then break; fi
            sleep 2
          done
          node apps/resident-pwa/tests/offline-browser-smoke.mjs
      - name: Show server logs if failed
        if: failure()
        run: tail -n 120 /tmp/resident-pwa.log || true
