name: Resident and Admin Checks
on:
  pull_request:
    paths:
      - 'apps/resident-pwa/**'
      - 'apps/admin-portal/**'
      - 'packages/**'
      - 'package*.json'
      - 'scripts/test-report.mjs'
      - '.github/workflows/resident-admin-checks.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Resident unit tests
        run: npm test --workspace=apps/resident-pwa
      - name: TypeScript checks
        run: npm run type-check --workspaces --if-present
      - name: Resident build
        run: npm run build:pwa
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://build-only.invalid'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'build-only-placeholder-key'
      - name: Admin build
        run: npm run build:admin
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://build-only.invalid'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'build-only-placeholder-key'
